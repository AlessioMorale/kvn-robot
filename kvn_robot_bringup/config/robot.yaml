# KVN rover hardware configuration: device ports and battery limits, in one place.
#
# The bring-up launch files read this file (kvn_robot_bringup.robot_config) and pass each value to
# the node that uses it, overriding that node's own YAML. Set KVN_ROBOT_CONFIG to the path of a
# copy (e.g. /etc/kvn/robot.yaml in kvn-ros.env) to configure a rover without editing the
# workspace. Values not listed here stay in the per-node files; see README.md
# ("Robot configuration") for what is and is not covered.

ports:
  motors: /dev/ttyAMA0            # DDSM-210 RS-485 bus (ros2_control hardware in the URDF)
  rc_receiver: /dev/ttyAMA1       # ELRS receiver, CRSF
  rc_receiver_baudrate: 460800    # must match the receiver's "Serial baud" setting
  lidar: /dev/ttyAMA2             # RPLIDAR C1
  lidar_baudrate: 460800
  imu: /dev/spidev0.0             # ISM330DHCX on SPI0
  wled: /dev/ttyACM0              # WLED ESP32 (signalling light), only used with use_wled:=true

# Status display (kvn_display), only used with use_display:=true. Optional: without this section
# the display node keeps the values of kvn_display/config/kvn_display.yaml.
# driver: a u8g2 full-buffer setup function without u8g2_Setup_ and _f
# (https://github.com/olikraus/u8g2/wiki/u8g2setupc); "_i2c_" in the name means I2C, else SPI.
display:
  driver: ssd1306_i2c_64x32_1f    # 0.49" 64x32 SSD1306; try ssd1306_i2c_64x32_noname if shifted
  i2c_device: /dev/i2c-1          # same bus as the INA3221
  i2c_address: 0x3C
  # An SPI display instead (keep it off SPI0, which the IMU uses):
  # driver: ssd1306_128x64_noname
  # spi_device: /dev/spidev1.0
  # gpio_chip: /dev/gpiochip0
  # dc_line: 24
  # reset_line: 25

# INA3221 power monitor at I2C1 0x40, resolved to its hwmonN directory at startup.
power_monitor: /sys/bus/i2c/devices/1-0040

# 4S Li-ion pack.
battery:
  cells: 4
  # Usable energy, empty (first curve point) to full: 4S x 2.5 Ah x 3.6 V nominal.
  capacity_wh: 36.0
  warn_voltage: 13.6              # 3.4 V/cell: WRN:BATT, amber light
  critical_voltage: 12.4          # 3.1 V/cell: FLT:BATT, red light, return home now
  overvoltage_warn: 16.9          # 4.225 V/cell
  overvoltage_error: 17.0         # 4.25 V/cell
  # Resting cell voltage at 0 %, 10 %, ... 100 % state of charge. Under load the voltage sags, so
  # the estimate reads low while driving (the return home triggers early, not late).
  cell_voltage_curve: [3.00, 3.30, 3.45, 3.55, 3.62, 3.68, 3.75, 3.83, 3.92, 4.05, 4.20]

# Battery-based return to home (kvn_orchestrator BatteryReturnHome): go home when the voltage is
# at or below battery.critical_voltage, or when the energy left is no more than
# distance_home x path_factor x wh_per_m + reserve_wh.
return_home:
  wh_per_m: 0.02                  # measure: (motor + compute Wh) / metres over a typical drive
  path_factor: 1.5                # driven distance / straight-line distance
  reserve_wh: 4.0
