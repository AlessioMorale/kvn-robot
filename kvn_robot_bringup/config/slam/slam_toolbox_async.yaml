# Slam Toolbox Configuration for Async SLAM
# Configured for KVN rover with LIDAR

slam_toolbox:
  ros__parameters:
    # Solver settings
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver_type: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    das_vars_lleaf: 25
    das_vars_current_leaf: 5
    verbosity_level: 0

    # Async slam settings
    use_async_mode: true
    mode: mapping

    # Topic names
    scan_topic: /scan
    tf_buffer_duration: 30.0
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05    # 5cm resolution for the occupancy grid
    max_laser_range: 8.0
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    spa_lambda_out: 0.1
    spa_lambda_in: 0.1
    occupied_space_weight: 1.0
    free_space_weight: 0.05
    loopback_scan_matching_enable: false

    # Matching parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_smear: 0.03
    correlation_search_space_resolution: 0.01
    correlation_search_window_size: 0.3
    do_loop_closing: true
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_query_resolution: 3.5
    loop_match_minimum_response_fine: 0.1
    loop_match_minimum_response_coarse: 0.3
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear: 0.03
    loop_search_maximum_variance: 5.0
    scan_buffer_size: 10
    scan_buffer_max_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_match_minimum_response_coarse: 0.3
    graphics_margin: 0.1
    response_shrink_factor: 0.95

    # Heap and processing
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_scan_range: 0.0
    maximum_scan_range: 8.0
    scan_downsampling_factor: 1
    use_response_expansion: true

    # Output configuration
    map_to_odom_transformation:
      x: 0.0
      y: 0.0
      yaw: 0.0
    map_negative_poses_near_zero: false
    first_map_only: false

    # Debug/logging
    debug_logging: false
