#!/usr/sbin/nft -f
# Foxglove bridge port 8765 and WebRTC signalling port 8443: reachable only over ZeroTier (design §5.3, §8).
# Dedicated table; touches nothing else (ssh etc. unaffected). Idempotent reload.
table inet kvn
delete table inet kvn

table inet kvn {
  chain input {
    type filter hook input priority filter; policy accept;
    tcp dport 8765 iifname "zt*" accept comment "foxglove_bridge over ZeroTier"
    tcp dport 8765 drop comment "foxglove_bridge: nowhere else"
    tcp dport 8443 iifname "zt*" accept comment "WebRTC signalling over ZeroTier"
    tcp dport 8443 drop comment "WebRTC signalling: nowhere else"
  }
}
