#!/usr/sbin/nft -f
# Foxglove bridge port 8765: reachable only over ZeroTier (design §5.3, §8).
# Dedicated table; touches nothing else (ssh etc. unaffected). Idempotent reload.
table inet kvn
delete table inet kvn

table inet kvn {
  chain input {
    type filter hook input priority filter; policy accept;
    tcp dport 8765 iifname "zt*" accept comment "foxglove_bridge over ZeroTier"
    tcp dport 8765 drop comment "foxglove_bridge: nowhere else"
  }
}
