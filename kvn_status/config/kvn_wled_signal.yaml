kvn_wled_signal_node:
  ros__parameters:
    serial_port: /dev/ttyACM0
    baudrate: 115200
    segment_id: 0
    brightness: 64
    mode_topic: /robot_mode
    robot_status_topic: /robot_status
    battery_topic: /battery_state
    joy_topic: /joy
    explore_status_topic: /explore/status
    navigation_status_topics:
      - /navigate_to_pose/_action/status
      - /navigate_through_poses/_action/status
    enable_button: 0
    low_battery_voltage: 13.6
    critical_battery_voltage: 12.4
    joy_timeout_s: 1.0
    battery_timeout_s: 3.0
    robot_status_timeout_s: 3.0
    navigation_status_timeout_s: 2.0
    update_period_s: 0.5
